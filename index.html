<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Langues & Horizons</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f5f1e9;
      color: white;
    }

    .hero {
      min-height: 100vh;
      background-image:
        linear-gradient(
          rgba(35, 45, 42, 0.18),
          rgba(35, 45, 42, 0.18)
        ),
        url("option%201%20pour%20site.png");

      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .content {
      max-width: 850px;
      padding: 40px;
    }

    h1 {
      font-size: clamp(3.5rem, 9vw, 7rem);
      font-weight: 400;
      letter-spacing: 4px;
      margin-bottom: 25px;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.35);
    }

    .tagline {
      font-family: Arial, sans-serif;
      font-size: clamp(0.85rem, 1.8vw, 1.1rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 45px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .button {
      display: inline-block;
      padding: 15px 38px;
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 30px;
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(3px);
    }

    .button:hover {
      background: white;
      color: #35413e;
    }

    @media (max-width: 600px) {
      .content {
        padding: 20px;
      }

      h1 {
        letter-spacing: 2px;
      }

      .tagline {
        letter-spacing: 2px;
        line-height: 1.8;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="content">

      <h1>Langues &amp; Horizons</h1>

      <p class="tagline">
        Apprendre · Oser · Rencontrer · Voyager · Progresser
      </p>

      <a href="#decouvrir" class="button">
        Découvrir
      </a>

    </div>

  </section>

</body>
</html>
