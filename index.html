<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Langues & Horizons</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #2f3a3a;
      background: #f7f4ee;
    }

    .hero {
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(30, 45, 45, 0.28), rgba(30, 45, 45, 0.28)),
        url("option%201%20pour%20site.png");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero-content {
      max-width: 900px;
      color: white;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6.5rem);
      font-weight: 400;
      letter-spacing: 3px;
      margin-bottom: 20px;
      text-shadow: 0 3px 15px rgba(0, 0, 0, 0.35);
    }

    .subtitle {
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      line-height: 1.6;
      margin-bottom: 35px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .slogan {
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-style: italic;
      line-height: 1.7;
      margin: 0 auto 40px;
      max-width: 700px;
    }

    .button {
      display: inline-block;
      padding: 14px 32px;
      border: 1px solid white;
      border-radius: 30px;
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .button:hover {
      background: white;
      color: #2f3a3a;
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="hero-content">

      <h1>Langues &amp; Horizons</h1>

      <p class="subtitle">
        Apprendre une langue, c’est ouvrir une porte vers le monde.
      </p>

      <p class="slogan">
        Les cours donnent les bases.<br>
        L’expérience donne la confiance.<br>
        Les échanges et les voyages font progresser.
      </p>

      <a href="#decouvrir" class="button">
        Découvrir
      </a>

    </div>
  </section>

</body>
</html>
